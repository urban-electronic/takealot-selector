name: Railway Auto Deploy

# Railway 平台构建暂停期间（2026-10-20 起）合并的提交不会自动部署。
# 这个定时任务每 10 分钟检查一次：线上 build 不是目标提交就触发部署，
# 一旦上线就自动空转退出。跑在 GitHub 的机器上，不依赖本地电脑开机。

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-auto-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Deploy latest main when Railway builds resume
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: python3 .github/scripts/railway_auto_deploy.py
