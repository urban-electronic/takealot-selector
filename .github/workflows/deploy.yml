name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      # 与 PR 门禁共用同一个入口。这里原本是手抄的 6 条，漏掉了
      # price / bookmarklet / values / operations / procurement 五套用例，
      # 于是「PR 上跑过的」和「上线前跑过的」变成两份清单，迟早会漂移。
      # 现在只认 npm run check，新增用例只要进 check 就自动挡住上线。
      - name: Run the full check suite
        run: npm run check
      - name: Build
        run: npm run build
        env:
          GH_PAGES: 'true'
      - name: SPA 404 fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
