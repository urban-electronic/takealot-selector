name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      # 与 PR 门禁共用同一个入口。这里原本是手抄的 6 条，漏掉了
      # price / bookmarklet / values / operations / procurement 五套用例，
      # 于是「PR 上跑过的」和「上线前跑过的」变成两份清单，迟早会漂移。
      # 现在只认 npm run check，新增用例只要进 check 就自动挡住上线。
      #
      # --quick：这个 job 只负责前端。后端 pytest 放在下面的 backend job 里跑，
      # 那边才装了 Python 依赖；这里若跑全套会因为缺依赖而整条流水线失败
      # （2026-10-18 就这么挂过一次，Pages 一直没发出去）。
      - name: Run the full check suite
        run: npm run check -- --quick
      - name: Build
        run: npm run build
        env:
          GH_PAGES: 'true'
      - name: SPA 404 fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  backend:
    # 后端由 Railway 单独部署，和 Pages 互不影响，所以故意不让 deploy 依赖它：
    # 它挂了要能一眼看见，但不该连带把前端卡住。--require-python 保证「装依赖失败」
    # 表现为红灯，而不是悄悄跳过、看着像通过。
    #
    # 这个 job 还负责 scripts/test-responsive-layout.py：那是拿真实 Chromium 量
    # 版式的审计，需要 node_modules（起 Vite）+ playwright + 浏览器，三样缺一不可。
    # 放在这里是因为 requirements.txt 本来就带 playwright，只差补 node_modules 和浏览器。
    name: Backend + layout tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -q -r backend/requirements.txt pytest
          npm install
      - name: Install Chromium for the layout audit
        run: python -m playwright install --with-deps chromium
      - name: Run backend tests
        run: node scripts/selfcheck.cjs --python-only --require-python

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 上面的 environment.url 引用 steps.deployment.outputs.page_url，没有这个 id
      # 环境链接会一直是空的；顺手补齐。
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # 默认 600000ms（10 分钟）：Pages 部署排队稍长就会被 action 自己判定
          # "Timeout reached, aborting!"，此时 build / backend 其实都已 success，
          # 前端却永远停在上一版（2026-11-06 的 ecce4b3 就踩过一次）。
          # 放宽到 20 分钟，让排队而不是代码决定部署成败。
          timeout: '1200000'
