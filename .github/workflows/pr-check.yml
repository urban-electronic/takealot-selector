name: PR Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck / visual / tests / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm install

      # 清单只维护一份：package.json 的 check 脚本。这条命令之前在这里和
      # deploy.yml 各抄了一遍，两边都漏了用例（这里漏 price / bookmarklet / values）。
      - name: Run the full check suite
        run: npm run check

      - name: Build
        run: npm run build

  backend:
    # 前端门禁之前完全没有覆盖 backend/：采集退避、调价、补货这些"算错了会亏钱"
    # 的逻辑只有本地 pytest 在跑，改坏了没人拦。这里补上。
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -q -r backend/requirements.txt pytest

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

