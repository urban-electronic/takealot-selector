name: PR Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck / visual / tests / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # 清单只维护一份：package.json 的 check 脚本。这条命令之前在这里和
      # deploy.yml 各抄了一遍，两边都漏了用例（这里漏 price / bookmarklet / values）。
      #
      # --quick：这个 job 只管前端。后端 pytest 在下面的 backend job 里跑，那边
      # 才装了 Python 依赖。这里原本也挂了 setup-python 却没装包，check 一旦包含
      # 后端 pytest 就必然失败。
      - name: Run the full check suite
        run: npm run check -- --quick

      - name: Build
        run: npm run build

  backend:
    # 前端门禁之前完全没有覆盖 backend/：采集退避、调价、补货这些"算错了会亏钱"
    # 的逻辑只有本地 pytest 在跑，改坏了没人拦。这里补上。
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -q -r backend/requirements.txt pytest

      # 走 selfcheck 而不是直接 pytest：scripts/test-*.py 那几个审计套件也要跑，
      # 手抄清单会漂。--require-python 让「依赖没装上」变成红灯而不是跳过。
      - name: Run backend tests
        run: node scripts/selfcheck.cjs --python-only --require-python

