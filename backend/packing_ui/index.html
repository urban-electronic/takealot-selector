<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>鲲鹏物流 · 装箱单工作台（云端共享版）</title><style>
:root{--ink:#22211f;--muted:#77736e;--line:#eae5dd;--accent:#ed6844;--bg:#f8f7f4;--white:#fff;--shadow:0 12px 40px rgba(37,29,22,.055)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Microsoft YaHei UI","PingFang SC",Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}.shell{max-width:1550px;margin:auto;padding:28px clamp(18px,3.2vw,50px) 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.eyebrow{font-size:12px;letter-spacing:.17em;color:var(--accent);font-weight:800}.top h1{font-size:clamp(25px,3vw,38px);margin:3px 0 2px;letter-spacing:-.04em}.subtitle{color:var(--muted);margin:0}.brand{display:flex;align-items:center;gap:15px}.logo{width:47px;height:47px;border-radius:15px;background:var(--ink);color:white;display:grid;place-items:center;font-size:24px;font-weight:800}.top-actions{display:flex;gap:9px}.btn{border:1px solid var(--line);background:white;color:var(--ink);border-radius:13px;padding:10px 15px;font-weight:700;white-space:nowrap}.btn:hover{border-color:#d9b0a2;background:#fff8f5}.btn.primary{background:var(--ink);border-color:var(--ink);color:white}.btn.primary:hover{background:#403c38}.btn.orange{background:var(--accent);border-color:var(--accent);color:white}.btn.orange:hover{background:#d85836}.btn.small{padding:7px 11px;font-size:13px}.tabs{display:flex;gap:8px;margin:27px 0 18px}.tab{border:1px solid var(--line);background:white;border-radius:28px;padding:9px 19px;font-weight:700;color:#514d48}.tab.active{border-color:#f6a58d;color:#aa431f;background:#fff2ec}.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(330px,.85fr);gap:20px;align-items:start}.card{background:white;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:22px;padding:24px}.card h2{font-size:18px;margin:0}.card-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.hint{color:var(--muted);font-size:13px}.search{border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:min(320px,100%);outline:0}.search:focus,input:focus,select:focus{border-color:var(--accent);outline:2px solid #fae7df}.toolbar{display:flex;align-items:center;gap:8px;margin:16px 0;flex-wrap:wrap}.count{color:var(--muted);font-size:13px;margin-left:auto}.product-list{max-height:min(52vh,560px);overflow:auto;border:1px solid var(--line);border-radius:15px}.product{display:grid;grid-template-columns:22px 50px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid #f1eee9;cursor:pointer}.product:last-child{border-bottom:0}.product:hover,.product.selected{background:#fff9f5}.product input{accent-color:var(--accent);width:17px;height:17px}.thumb{width:50px;height:50px;border-radius:11px;background:#f5f3ef;display:grid;place-items:center;overflow:hidden;color:#b1aaa1;font-size:19px}.thumb img{width:100%;height:100%;object-fit:cover}.sku{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.025em}.zh{font-weight:700;overflow-wrap:anywhere}.en{font-size:12px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:100%}.item-actions{display:flex;gap:5px}.mini{border:0;background:transparent;color:#8b8176;padding:7px;border-radius:7px;font-size:13px}.mini:hover{background:#f2eee8;color:var(--ink)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field label{display:block;font-size:13px;color:#615e59;margin-bottom:6px;font-weight:650}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#fff;color:var(--ink)}.card hr{border:0;border-top:1px solid var(--line);margin:22px 0}.hero{background:#201f1d;color:white;border-radius:19px;padding:22px 23px;margin:0 0 17px;position:relative;overflow:hidden}.hero:before{content:"";position:absolute;width:180px;height:180px;border:33px solid #51362c;border-radius:50%;right:-36px;top:-80px;opacity:.64}.hero>*{position:relative}.hero .tag{color:#bdb7af;font-size:13px}.hero strong{display:block;font-size:40px;letter-spacing:-.06em;margin:5px 0 0}.hero small{color:#bbb4ab}.selected-list{max-height:280px;overflow:auto}.selected-row{display:grid;grid-template-columns:minmax(0,1fr) 66px 70px 65px 24px;gap:7px;align-items:center;padding:11px 0;border-bottom:1px solid #f2eee9}.selected-row input{width:100%;padding:7px;border:1px solid var(--line);border-radius:8px}.selected-row .label{font-size:12px}.selected-row .label strong{display:block;font-size:13px}.empty{text-align:center;padding:45px 20px;color:var(--muted)}.image-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:13px;max-height:60vh;overflow:auto}.image-card{border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer}.image-card:hover{border-color:var(--accent)}.image-card .photo{height:122px;border-radius:9px;background:#f5f2ee;display:grid;place-items:center;color:#bbb5ad;overflow:hidden}.image-card img{width:100%;height:100%;object-fit:cover}.image-card strong{font-size:13px;display:block;margin-top:8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.image-card small{color:var(--muted)}.modal-backdrop{position:fixed;inset:0;background:#1713109c;display:none;place-items:center;padding:15px;z-index:10}.modal-backdrop.show{display:grid}.modal{background:white;border-radius:20px;padding:24px;width:min(650px,100%);max-height:92vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{margin:0}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:23px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#232120;color:white;padding:10px 18px;border-radius:12px;box-shadow:0 8px 24px #0002;display:none;z-index:20}.toast.show{display:block}.hidden{display:none!important}.apibar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:#fff6f2;border:1px solid #f3d7ca;border-radius:14px;padding:9px 13px;margin-bottom:14px}.apibar input{flex:1;min-width:200px;border:1px solid var(--line);border-radius:10px;padding:8px 11px;outline:0}.apibar .key-hint{color:var(--muted);font-size:12px}@media(max-width:980px){.grid{grid-template-columns:1fr}.product-list{max-height:340px}.shell{padding-top:17px}.hero strong{font-size:34px}}@media(max-width:560px){.card{padding:16px}.formgrid{gap:10px}.top-actions{width:100%}.top-actions button{flex:1}.product{grid-template-columns:20px 42px minmax(0,1fr)}.product .item-actions{grid-column:3;justify-self:start}.thumb{width:42px;height:42px}.tabs{margin:18px 0 12px}}
</style></head><body><div class="shell"><div class="apibar"><span class="key-hint">API Key</span><input id="apiKey" type="password" placeholder="填写服务端 API_KEY（未启用鉴权可留空）"><button class="btn small" id="saveKey">保存 Key</button><span class="key-hint" id="keyStatus"></span></div><header class="top"><div class="brand"><div class="logo">鲲</div><div><div class="eyebrow">KUNPENG · PACKING LIST · CLOUD</div><h1>装箱单工作台</h1><p class="subtitle">选择产品，调整数量，生成带图片的装箱单。资料保存在云端，多人实时共享。</p></div></div><div class="top-actions"><button class="btn" id="new">新增产品</button><button class="btn primary" id="exportTop">导出 Excel</button></div></header><nav class="tabs"><button class="tab active" data-tab="products">产品库</button><button class="tab" data-tab="images">图片库</button></nav><main class="grid"><section class="card"><div id="productsPanel"><div class="card-title"><div><h2>产品资料</h2><span class="hint">中文、英文与 SKU 各自独立，支持搜索与多选。</span></div><input class="search" id="search" placeholder="搜索 SKU / 中文 / English"></div><div class="toolbar"><button class="btn small orange" id="addSelected">加入装箱单</button><button class="btn small" id="clearChecks">清除勾选</button><button class="btn small" id="pendingOnly">仅看待确认</button><span class="count" id="results"></span></div><div class="product-list" id="products"></div></div><div id="imagesPanel" class="hidden"><div class="card-title"><div><h2>产品图片库</h2><span class="hint">点击产品上传或更换图片，导出时自动带入。</span></div></div><input class="search" id="imageSearch" placeholder="搜索图片库产品" style="margin-bottom:15px;width:100%"><div class="image-grid" id="imageGrid"></div></div></section><aside class="card"><div class="hero"><span class="tag">本次装箱单 · PACKING LIST</span><strong id="selectedTotal">0 件产品</strong><small>多人共享 · 实时保存</small></div><div class="card-title"><h2>出货信息</h2></div><div class="formgrid"><div class="field"><label>日期</label><input id="date" type="date"></div><div class="field"><label>客户唛头</label><input id="mark" value="KPLDJ"></div><div class="field"><label>运输方式</label><select id="shipping"><option value="空">空运</option><option value="海">海运</option></select></div><div class="field"><label>头程收货地址</label><input id="address" value="找客服提供"></div></div><hr><div class="card-title"><h2>已选产品</h2><span class="hint">箱数 / 每箱件数 / 总件数</span></div><div class="selected-list" id="selectedList"><div class="empty">还没有加入产品</div></div><button class="btn primary" id="exportBottom" style="width:100%;margin-top:20px">生成 Excel 文件</button></aside></main></div><div id="modalWrap" class="modal-backdrop"><div class="modal"><div class="modal-head"><h2 id="modalTitle"></h2><button class="mini" id="closeModal" aria-label="关闭">✕</button></div><div id="modalBody"></div><div class="modal-foot"><button class="btn" id="cancelModal">取消</button><button class="btn orange" id="saveModal">保存</button></div></div></div><div class="toast" id="toast"></div><script>
let products=[], selected=new Map(), checks=new Set(), editing=null, imageSku=null, timer, onlyPending=false, imgCache=new Map();
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.remove('show'),3600)}
function apiKey(){return localStorage.getItem('packing_api_key')||''}
function authHeaders(json){const h=json?{'Content-Type':'application/json'}:{};const k=apiKey();if(k)h['X-API-Key']=k;return h}
async function api(path,data){const response=await fetch(path,{method:data===undefined?'GET':'POST',headers:authHeaders(data!==undefined),body:data===undefined?undefined:JSON.stringify(data)});if(!response.ok){let error;try{error=(await response.json()).error}catch{}throw Error(error||'操作失败')}return response.json()}
async function load(){products=await api('/api/packing/products');render()}
function product(sku){return products.find(p=>p.sku===sku)}
function filtered(term){
 let q=term.trim().toLowerCase();if(!q)return products;
 let aliases=[q];if(/[\u3400-\u9fff]子$/.test(q)&&q.length>=2)aliases.push(q.slice(0,-1));
 const synonyms={'袜子':['袜','socks','sock'],'运动袜':['袜','sport socks'],'手套':['gloves','glove'],'硬盘':['hdd','hard drive']};
 aliases.push(...(synonyms[q]||[]));
 const scored=[];for(let p of products){let fields=[p.sku,p.name_zh,p.name_en].map(v=>String(v||'').toLowerCase());let score=999;
 for(let a of aliases){for(let f of fields){let pos=f.indexOf(a);if(pos>=0)score=Math.min(score,pos===0?0:pos<5?1:2)}}
 if(score<999)scored.push({p,score})}
 return scored.sort((a,b)=>a.score-b.score).map(x=>x.p)
}
function photo(p){return p.image_file?`<img data-fn="${esc(p.image_file)}" alt="">`:'◇'}
function hydrateImages(){document.querySelectorAll('img[data-fn]').forEach(img=>{const fn=img.dataset.fn;if(img.dataset.loaded)return;if(imgCache.has(fn)){img.src=imgCache.get(fn);img.dataset.loaded=1;return}fetch('/api/packing/images/'+encodeURIComponent(fn),{headers:authHeaders(false)}).then(r=>{if(!r.ok)throw Error('图片加载失败');return r.blob()}).then(b=>{const url=URL.createObjectURL(b);imgCache.set(fn,url);img.src=url;img.dataset.loaded=1}).catch(()=>{img.dataset.loaded=1})})}
function render(){let found=filtered($('search').value).filter(p=>!onlyPending||p.electric==='待确认'||p.magnetic==='待确认');$('results').textContent=`${found.length} / ${products.length} 件产品`;$('products').innerHTML=found.map(p=>`<div class="product ${checks.has(p.sku)?'selected':''}" data-sku="${esc(p.sku)}"><input type="checkbox" data-action="check" ${checks.has(p.sku)?'checked':''}><div class="thumb">${photo(p)}</div><div><div class="sku">${esc(p.sku)}</div><div class="zh">${esc(p.name_zh||'未填写中文名称')}</div><div class="en" title="${esc(p.name_en||'')}">${esc(p.name_en||'未填写英文名称')}</div><div class="hint" style="font-size:11px">带电 ${esc(p.electric||'待确认')} · 带磁 ${esc(p.magnetic||'待确认')}</div></div><div class="item-actions"><button class="mini" data-action="image" title="图片">图片</button><button class="mini" data-action="edit" title="编辑">编辑</button></div></div>`).join('')||'<div class="empty">没有找到匹配的产品</div>';
 let foundImages=filtered($('imageSearch').value);$('imageGrid').innerHTML=foundImages.map(p=>`<div class="image-card" data-sku="${esc(p.sku)}"><div class="photo">${photo(p)}</div><strong>${esc(p.name_zh||p.name_en)}</strong><small>${esc(p.sku)}</small></div>`).join('');renderSelected();hydrateImages()}
function renderSelected(){let data=[...selected.entries()].filter(([sku])=>product(sku));$('selectedTotal').textContent=data.length+' 件产品';$('selectedList').innerHTML=data.length?data.map(([sku,item])=>{let p=product(sku);return `<div class="selected-row" data-sku="${esc(sku)}"><div class="label"><strong>${esc(p.name_zh||p.name_en)}</strong><span class="sku">${esc(sku)}</span></div><input aria-label="箱数" title="箱数" type="number" min="1" step="1" data-field="cartons" value="${esc(item.cartons)}"><input aria-label="每箱件数" title="每箱件数" type="number" min="1" step="1" data-field="count" value="${esc(item.count)}"><span class="hint" data-total="${esc(sku)}">${(Number(item.cartons)||0)*(Number(item.count)||0)}</span><button class="mini" data-action="remove" title="移除">✕</button></div>`}).join(''):'<div class="empty">还没有加入产品<br><small>从左侧勾选后点击“加入装箱单”</small></div>'}
function modal(title,body,save){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalWrap').classList.add('show');$('saveModal').onclick=save}
function closeModal(){$('modalWrap').classList.remove('show')}
function edit(sku){editing=sku;let p=sku?product(sku):{};let fields=[['sku','SKU'],['name_zh','中文名称'],['name_en','English name'],['unit','单位'],['weight','重量 (KG)'],['material','材质'],['brand','有牌子（是/否）'],['battery','电池参数'],['electric','带电（是/否）'],['magnetic','带磁（是/否）']];modal(sku?'编辑产品资料':'新增产品',`<div class="formgrid">${fields.map(([key,label])=>`<div class="field" style="${key==='name_en'?'grid-column:1/-1':''}"><label>${label}</label><input id="f_${key}" value="${esc(p?.[key]||'')}"></div>`).join('')}</div>`,async()=>{let data={old_sku:sku};for(let [key] of fields)data[key]=$('f_'+key).value;try{await api('/api/packing/product',data);if(sku&&sku!==data.sku&&selected.has(sku)){selected.set(data.sku,selected.get(sku));selected.delete(sku)}closeModal();await load();notify('产品已保存')}catch(e){notify(e.message)}})}
function imageModal(sku){let p=product(sku);if(!p)return;imageSku=sku;modal('图片库 · '+(p.name_zh||p.name_en),`<div style="display:grid;grid-template-columns:180px 1fr;gap:18px;align-items:center"><div class="thumb" style="width:180px;height:180px;font-size:42px">${photo(p)}</div><div><div class="sku">${esc(p.sku)}</div><p>${esc(p.name_zh||'')}<br><span class="hint">${esc(p.name_en||'')}</span></p><div class="field"><label>选择 PNG 或 JPG 图片（最多 20 MB）</label><input id="imageFile" type="file" accept="image/png,image/jpeg"></div><button class="mini" id="removeImage" style="margin-top:15px">移除当前图片</button></div></div>`,async()=>{hydrateImages();let file=$('imageFile').files[0];if(!file){closeModal();return}if(file.size>20*1024*1024){notify('图片不能超过 20 MB');return}let data=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(file)});try{await api('/api/packing/image',{sku,data});closeModal();await load();notify('图片已加入图片库')}catch(e){notify(e.message)}});$('removeImage').onclick=async()=>{try{await api('/api/packing/image',{sku,data:'',remove:true});closeModal();await load();notify('图片已移除')}catch(e){notify(e.message)}}}
$('products').onclick=e=>{let row=e.target.closest('[data-sku]');if(!row)return;let sku=row.dataset.sku,action=e.target.closest('[data-action]')?.dataset.action;if(action==='edit')return edit(sku);if(action==='image')return imageModal(sku);if(checks.has(sku))checks.delete(sku);else checks.add(sku);render()};$('imageGrid').onclick=e=>{let row=e.target.closest('[data-sku]');if(row)imageModal(row.dataset.sku)};
$('selectedList').oninput=e=>{let row=e.target.closest('[data-sku]'),field=e.target.dataset.field;if(row&&field){selected.get(row.dataset.sku)[field]=e.target.value;row.querySelector("[data-total]").textContent=String((Number(selected.get(row.dataset.sku).cartons)||0)*(Number(selected.get(row.dataset.sku).count)||0))}};$('selectedList').onclick=e=>{let row=e.target.closest('[data-sku]');if(row&&e.target.dataset.action==='remove'){selected.delete(row.dataset.sku);renderSelected()}};
$('addSelected').onclick=()=>{for(let sku of checks){let p=product(sku);if(p&&!selected.has(sku))selected.set(sku,{cartons:'1',count:'1'})}checks.clear();render();notify('已加入装箱单')};$('clearChecks').onclick=()=>{checks.clear();render()};$('pendingOnly').onclick=()=>{onlyPending=!onlyPending;$('pendingOnly').textContent=onlyPending?'显示全部产品':'仅看待确认';render()};$('new').onclick=()=>edit(null);$('search').oninput=()=>{clearTimeout(window.searchTimer);window.searchTimer=setTimeout(render,140)};$('imageSearch').oninput=()=>{clearTimeout(window.imageTimer);window.imageTimer=setTimeout(render,140)};
for(let tab of document.querySelectorAll('.tab'))tab.onclick=()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===tab));$('productsPanel').classList.toggle('hidden',tab.dataset.tab!=='products');$('imagesPanel').classList.toggle('hidden',tab.dataset.tab!=='images')};
$('closeModal').onclick=$('cancelModal').onclick=closeModal;$('modalWrap').onclick=e=>{if(e.target===$('modalWrap'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
$('saveKey').onclick=()=>{const v=$('apiKey').value.trim();localStorage.setItem('packing_api_key',v);$('keyStatus').textContent=v?'Key 已保存':'已清空 Key';setTimeout(()=>{$('keyStatus').textContent=''},1800);load().catch(e=>notify(e.message))};$('apiKey').addEventListener('keydown',e=>{if(e.key==='Enter')$('saveKey').click()});
async function exportList(){if(!selected.size)return notify('请先加入产品');let b=this;b.disabled=true;b.textContent='正在生成…';try{let data={date:$('date').value,mark:$('mark').value,shipping:$('shipping').value,address:$('address').value,items:[...selected].map(([sku,v])=>({sku,...v}))};if(data.items.some(x=>![x.cartons,x.count].every(v=>Number.isInteger(Number(v))&&Number(v)>0)))throw Error('箱数和每箱件数须为正整数');let response=await fetch('/api/packing/export',{method:'POST',headers:authHeaders(true),body:JSON.stringify(data)});if(!response.ok)throw Error((await response.json()).error||'生成失败');let blob=await response.blob();let link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='装箱单_'+data.date+'.xlsx';document.body.append(link);link.click();setTimeout(()=>{URL.revokeObjectURL(link.href);link.remove()},1000);notify('Excel 已生成并开始下载')}catch(e){notify(e.message)}finally{b.disabled=false;b.textContent=b.id==='exportTop'?'导出 Excel':'生成 Excel 文件'}}
$('exportTop').onclick=exportList;$('exportBottom').onclick=exportList;$('date').value=new Date().toLocaleDateString('sv-SE');$('apiKey').value=apiKey();load().catch(e=>notify(e.message));
</script></body></html>
